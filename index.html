<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q1 Skills Test</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://pyscript.net/releases/2025.3.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2025.3.1/core.js"></script>
    <!--
            <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
            <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
            
            <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css" />
            <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
        -->
    <style>
        body{
            background-image: url(https://i.pinimg.com/736x/4f/26/e6/4f26e66628ccb54098da79d4b3d411fa.jpg);
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
             min-height: 100vh;
        }
        
        .container{ 
            border-radius: 10px;
            background-color: rgb(255, 206, 232);
            padding: 20px;
            margin: auto;
            margin-top: 9%;
            width: 700px;
            box-shadow: 5px 5px 15px 5px rgba(0,0,0,0.52)
        }

        .button {
            background-color: rgb(211, 251, 211);
            color: rgb(131, 221, 155);
            padding: 10px;
            cursor: pointer;
            font-weight: bold;
            margin-left: 500px;
       }

        h1, h3{
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Madcha•̀ ᴖ •́</h1>
        <h3>Select your order:</h3>
        <form>
            <div class="row">
                <div class="col-lg-6">
                    <label for="choose" style="font-weight: bold;">Drink:</label>
                            
                        <br>
                        
                        <input type="checkbox" id="item1" value="120">
                        <label for="item1">I Luv Matcha a Latte🍵</label>
                            <br>
                        <input type="checkbox" id="item2" value="130">
                        <label for="item2">Pink Strawberry Matcha🍓</label>
                            <br>
                        <input type="checkbox" id="item3" value="140">
                        <label for="item3">CocoMatchaNut🥥 </label>
                            <br>
                        <input type="checkbox" id="item4" value="130">
                        <label for="item4">Lotus Biscoff Matcha🤎</label>
                            <br>
                        <input type="checkbox" id="item5" value="140">
                        <label for="item5">Special Acai Matchuw🫐</label>
                    </div>

                    <div class="col-lg-6">
                        <label for="choose" style="font-weight: bold;">Size:</label>

                            <br>

                        <input type="radio" id="regular" value=0 name="size" required>
                        <label for="regular">Tall (+ ₱0)</label>

                            <br>

                        <input type="radio" id="upsize" value="30" name="size">
                        <label for="upsize">Grande (+ ₱30)</label>

                            <br>

                        <input type="radio" id="upsize" value="50" name="size">
                        <label for="upsize">Venti (+ ₱50)</label>
                    </div>
                </div>

                <br>
                
                <label for="addons">Adds on for your matcha?</label>  
                <select id="addons">
                    <option value="0">Matcha is perfectly fine</option>
                    <option value="20">2 pumps of vanilla syrup</option>
                    <option value="20">2 pumps of strawberry</option>
                    <option value="20">2 pumps of white mocha</option>
                </select>   
            
            <br>

                <button type="button" class="button" py-click="place_order">ORDER MATCHA</button>    
            </form>     

            <br>

        <h3>Your Receipt:</h3>
        <div id="output1"></div>

        <script type="py" src="main.py"></script>
    </div>
</body>
</html>
